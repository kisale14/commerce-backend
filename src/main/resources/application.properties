# =========================================================
# CONFIGURACIÓN DE CONEXIÓN A POSTGRESQL
# =========================================================
# URL de la base de datos (puerto por defecto: 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_clientes_db

# Usuario y Contraseña creados en PostgreSQL
spring.datasource.username=postgres
spring.datasource.password=admin

# Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# POOL DE CONEXIONES (HikariCP - Optimización de rendimiento)
# =========================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# =========================================================
# MIGRACIÓN Y CREACIÓN AUTOMÁTICA DE TABLAS (SPRING JDBC)
# =========================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Cambiamos el separador por defecto para soportar funciones PL/pgSQL
spring.sql.init.separator=;;

# Ponemos en false para no ignorar errores si el script falla
spring.sql.init.continue-on-error=false

# =========================================================
# PARÁMETROS DE CONFIGURACIÓN ADICIONALES (JWT)
# =========================================================
jwt.secret=CLAVE_SUPER_SECRETA_Y_SEGURA_PARA_FIRMAR_LOS_TOKENS_JWT_2026
jwt.expiration=86400000